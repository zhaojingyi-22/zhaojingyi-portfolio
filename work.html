<script>
  // EdgeOne 预览令牌透传：给所有内部链接自动带上 eo_token / eo_time
  (function(){
    var p = new URLSearchParams(location.search);
    var token = p.get("eo_token");
    var time = p.get("eo_time");
    if(!token) return;
    function patchHref(href){
      if(!href) return href;
      if(href.indexOf("index.html") === 0 || href.indexOf("work.html") === 0){
        var sep = href.indexOf("?") === -1 ? "?" : "&";
        return href + sep + "eo_token=" + encodeURIComponent(token) + (time ? "&eo_time=" + encodeURIComponent(time) : "");
      }
      return href;
    }
    function patchAll(){
      document.querySelectorAll('a[href]').forEach(function(a){
        var orig = a.getAttribute("href");
        var patched = patchHref(orig);
        if(patched !== orig) a.setAttribute("href", patched);
      });
    }
    // 先 patch 已有的 HTML 链接，等 work.js 执行后再 patch 动态生成的分页链接
    patchAll();
    if(document.readyState !== "loading"){ patchAll(); }
    else { document.addEventListener("DOMContentLoaded", patchAll); }
    // 兜底：work.js 同步执行后再 patch 一次分页链接
    setTimeout(patchAll, 0);
  })();
</script>
<script src="js/work.js"></script>
<script>
  // 共享的导航滚动 + 移动端菜单
  (function(){
    var nav = document.getElementById("nav");
    function onScroll(){
      if(window.scrollY > 40){ nav.classList.add("scrolled"); }
      else{ nav.classList.remove("scrolled"); }
    }
    window.addEventListener("scroll", onScroll, {passive:true});
    onScroll();
    var navToggle = document.getElementById("navToggle");
    var navLinks = document.getElementById("navLinks");
    if(navToggle){
      navToggle.addEventListener("click", function(){
        navToggle.classList.toggle("open");
        navLinks.classList.toggle("open");
      });
    }
    // 再次 patch 分页链接（work.js 已执行完毕）
    var p = new URLSearchParams(location.search);
    var token = p.get("eo_token");
    var time = p.get("eo_time");
    if(token){
      document.querySelectorAll('a[href^="work.html"], a[href^="index.html"]').forEach(function(a){
        var href = a.getAttribute("href");
        if(href.indexOf("eo_token") === -1){
          var sep = href.indexOf("?") === -1 ? "?" : "&";
          a.setAttribute("href", href + sep + "eo_token=" + encodeURIComponent(token) + (time ? "&eo_time=" + encodeURIComponent(time) : ""));
        }
      });
    }
  })();
</script>
